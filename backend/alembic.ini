[alembic]
script_location = alembic

# Add the backend/ directory (cwd when alembic is invoked) to sys.path so
# env.py can `import app.core.config`, `import app.models`, etc.
prepend_sys_path = .

# File naming: 0001_initial_schema.py, 0002_xxx.py, ...
file_template = %%(rev)s_%%(slug)s

# DATABASE_URL is injected by env.py from our Settings (.env). Leaving this
# blank prevents accidental hardcoding of credentials in alembic.ini.
sqlalchemy.url =

version_path_separator = os
output_encoding = utf-8


# ----------------------------------------------------------------------------
# Logging
# ----------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
